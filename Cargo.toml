[package]
name = "agent-log"
version = "0.1.0"
edition = "2021"
description = "CLI nástroj pro zaznamenávání akcí AI agenta"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
